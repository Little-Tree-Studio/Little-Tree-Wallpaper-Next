[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "little-tree-wallpaper"
version = "2.0.0"
description = "小树壁纸 Next - 桌面壁纸管理应用后端"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Little Tree Studio" },
]
keywords = ["wallpaper", "desktop", "pywebview", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
]
dependencies = [
    "aiohttp>=3.14.0",
    "certifi>=2026.5.20",
    "loguru>=0.7.3",
    "pillow>=12.2.0",
    "platformdirs>=4.10.0",
    "psutil>=7.2.2",
    "pyperclip>=1.11.0",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
    "requests>=2.34.2",
    "rtoml>=0.12.0",
    "PyYAML>=6.0.2",
]

[project.scripts]
little-tree-wallpaper = "backend.main:main"

[project.gui-scripts]
little-tree-wallpaper-gui = "backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = []
