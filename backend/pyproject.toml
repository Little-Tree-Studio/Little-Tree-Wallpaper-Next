[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "little-tree-wallpaper"
version = "2.0.0"
description = "A modern cross-platform wallpaper manager for Bing, Windows Spotlight, custom sources and more."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Little Tree Studio" },
]
keywords = ["wallpaper", "desktop", "lumiview", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",    
    "Topic :: Desktop Environment",
]
dependencies = [
    "aiohttp>=3.14.3",
    "certifi>=2026.6.17",
    "cryptography>=45.0.0",
    "fastapi>=0.115.0",
    "fonttools>=4.60.0",
    "loguru>=0.7.3",
    "pillow>=12.2.0",
    "platformdirs>=4.10.0",
    "psutil>=7.2.2",
    "pycaw>=20240210; platform_system=='Windows'",
    "pyperclip>=1.11.0",
    "pystray>=0.19.5",
    "pywin32>=306; platform_system=='Windows'",
    "requests>=2.34.2",
    "rtoml>=0.12.0",
    "PyYAML>=6.0.2",
    "uvicorn>=0.32.0",
    "windows-toasts>=1.3.1; platform_system=='Windows'",
    "lumiview==0.1.0.dev4",
]

[project.scripts]
little-tree-wallpaper = "backend.main:main"

[project.gui-scripts]
little-tree-wallpaper-gui = "backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.0.0",
    "ruff>=0.12.0",
]
